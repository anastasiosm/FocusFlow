apiVersion: apps/v1
kind: Deployment
metadata:
  name: focusflow-api
  namespace: focusflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: focusflow-api
  template:
    metadata:
      labels:
        app: focusflow-api
    spec:
      containers:
      - name: api
        image: focusflow-api:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: focusflow-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__DefaultConnection
          value: "Host=$(POSTGRES_HOST);Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: focusflow-config
              key: POSTGRES_HOST
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: focusflow-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: focusflow-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: focusflow-secrets
              key: POSTGRES_PASSWORD
        - name: JwtSettings__Secret
          valueFrom:
            secretKeyRef:
              name: focusflow-secrets
              key: JWT_SECRET
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: focusflow-api
  namespace: focusflow
spec:
  selector:
    app: focusflow-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
