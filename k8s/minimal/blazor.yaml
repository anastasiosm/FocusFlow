apiVersion: apps/v1
kind: Deployment
metadata:
  name: focusflow-blazor
  namespace: focusflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: focusflow-blazor
  template:
    metadata:
      labels:
        app: focusflow-blazor
    spec:
      containers:
      - name: blazor
        image: focusflow-blazor:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: focusflow-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ApiBaseUrl
          value: "http://focusflow-api:8080"
        ports:
        - containerPort: 8081
          name: http
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: focusflow-blazor
  namespace: focusflow
spec:
  selector:
    app: focusflow-blazor
  ports:
  - port: 8081
    targetPort: 8081
    name: http
  type: ClusterIP
