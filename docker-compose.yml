services:
  focusflow-api:
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: src/FocusFlow.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - "ConnectionStrings:DefaultConnection=Host=postgres-db;Port=5432;Database=FocusFlowDb;Username=postgres;Password=postgres"
      - "Jwt:Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm"
      - "Jwt:Issuer=FocusFlowApi"
      - "Jwt:Audience=FocusFlowClient"
      - TEST_USER_EMAIL=test@example.com
      - TEST_USER_PASSWORD=Password123!
      # (Development) API serves HTTP only inside Docker to avoid HTTPS redirect name-mismatch
    depends_on:
      postgres-db:
        condition: service_healthy
    tmpfs:
      - /tmp
    # no certificate mount for API in dev

  focusflow-blazor:
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: src/FocusFlow.BlazorApp/Dockerfile
    ports:
      - "5050:8080" # HTTP
      - "5051:8081" # HTTPS
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ApiBaseUrl=http://focusflow-api:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD:-MyPfxPassword123!}
    depends_on:
      - focusflow-api
    tmpfs:
      - /tmp
    volumes:
      - ./certs:/https:ro

  postgres-db:
    image: postgres:17.2
    environment:
      POSTGRES_DB: FocusFlowDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # ports:
    #   - "5432:5432"
    volumes:
      - focusflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  focusflow-db-data:
