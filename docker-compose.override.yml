services:
  focusflow-api:
    environment:
      # Development-specific overrides
      - ASPNETCORE_ENVIRONMENT=Development
      # Use these for local debugging without HTTPS complications
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    # Remove HTTPS port in development override for simplicity
    # Mount user secrets for development
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro

  focusflow-blazor:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Development: HTTP only to avoid certificate issues
      - ASPNETCORE_URLS=http://+:8080
      - ApiBaseUrl=http://focusflow-api:8080
    ports:
      - "5000:8080"
    # Override volumes to skip HTTPS in development
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro

  postgres-db:
    # Development override: add pgAdmin for easier database management
    environment:
      POSTGRES_DB: FocusFlowDb_Dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

