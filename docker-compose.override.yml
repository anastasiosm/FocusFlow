services:
  focusflow-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - "Jwt:Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm"
      - "Jwt:Issuer=FocusFlowAPI"
      - "Jwt:Audience=FocusFlowClients"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  focusflow-blazor:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
      - "5001:8081"
